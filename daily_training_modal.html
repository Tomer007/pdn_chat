<!-- Daily Training Modal - Insert before closing body tag -->
<div class="plan-modal" id="dailyTrainingModal">
    <div class="plan-content">
        <div class="plan-header">
            <div class="plan-title-container">
                <div class="plan-title-main">
                    <i class="fas fa-dumbbell plan-icon"></i>
                    <h3 class="plan-title">אימון יומי</h3>
                </div>
                <div class="plan-subtitle">המשימה שלך להיום</div>
                <div class="plan-description">
                    הזן את המשימה היומית שלך ותקבל הדרכה מותאמת אישית
                </div>
            </div>
            <button class="plan-close" onclick="hideDailyTrainingModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="plan-body">
            <form id="dailyTrainingForm" onsubmit="submitDailyTraining(event)">
                <div class="form-group">
                    <label for="dailyTask" class="form-label">
                        <i class="fas fa-tasks"></i>
                        מה המשימה שלך להיום?
                    </label>
                    <textarea 
                        id="dailyTask" 
                        name="task" 
                        class="form-textarea" 
                        placeholder="לדוגמה: יום 1 - כתוב רפלקציה של 200 מילים על מה זה אומר עבורך להוריד 5 ק&quot;ג"
                        required
                        rows="6"
                        onkeydown="handleDailyTrainingKeyPress(event)"
                    ></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="plan-btn cancel" onclick="hideDailyTrainingModal()">
                        <i class="fas fa-times"></i>
                        ביטול
                    </button>
                    <button type="submit" class="plan-btn submit" id="submitDailyTrainingBtn">
                        <i class="fas fa-paper-plane"></i>
                        שלח משימה
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Daily Training Modal Functions
function showDailyTrainingModal() {
    const modal = document.getElementById('dailyTrainingModal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
        document.getElementById('dailyTask').focus();
    }, 100);
}

function hideDailyTrainingModal() {
    const modal = document.getElementById('dailyTrainingModal');
    modal.style.display = 'none';
    document.body.style.overflow = '';
    document.getElementById('dailyTrainingForm').reset();
}

async function submitDailyTraining(event) {
    event.preventDefault();
    const submitBtn = document.getElementById('submitDailyTrainingBtn');
    const originalText = submitBtn.innerHTML;
    
    try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> שולח...';
        
        const formData = new FormData(event.target);
        const task = formData.get('task').trim();
        
        if (!task) {
            showError('אנא הזן את המשימה היומית');
            return;
        }
        
        hideDailyTrainingModal();
        
        const chatContainer = document.getElementById("chatContainer");
        const userBubble = document.createElement("div");
        userBubble.className = "chat-bubble user animated";
        const userTime = getCurrentTime();
        const userContent = safeMarkdownParse('אימון יומי:\n' + task);
        userBubble.innerHTML = `
            <div class="message-header">${USER_NAME}:</div>
            <div class="message-content">${userContent}</div>
            <div class="message-time">${userTime}</div>
        `;

        saveMessageToHistory({
            type: 'user',
            content: userContent,
            timestamp: userTime
        });

        chatContainer.appendChild(userBubble);
        scrollToBottom(true);
        
        const typing = document.createElement("div");
        typing.className = "typing-indicator";
        typing.innerHTML = `
            בינת קוד המקור
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;
        chatContainer.appendChild(typing);
        scrollToBottom(true);
        
        const response = await fetch('/pdn-chat-ai/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                message: 'אימון יומי: ' + task,
                user_name: USER_NAME,
                user_id: USER_ID,
                pdn_code: PDN_CODE
            })
        });
        
        typing.remove();
        
        if (response.ok) {
            const data = await response.json();
            
            const botBubble = document.createElement("div");
            botBubble.className = "chat-bubble bot animated";
            const botTime = getCurrentTime();
            const botContent = safeMarkdownParse(data.message || data.response);
            botBubble.innerHTML = `
                <div class="message-header">בינת קוד המקור:</div>
                <div class="message-content">${botContent}</div>
                <div class="message-time">${botTime}</div>
            `;

            saveMessageToHistory({
                type: 'bot',
                content: botContent,
                timestamp: botTime,
                header: 'בינת קוד המקור:'
            });

            chatContainer.appendChild(botBubble);
            scrollToBottom(true);
            
            showSuccess('המשימה נשלחה בהצלחה!');
        } else {
            if (response.status === 403) {
                const errorData = await response.json();
                showError(errorData.response || 'אין לך הרשאה לגשת למערכת');
            } else {
                showError('שגיאה בשליחת המשימה');
            }
        }
        
    } catch (error) {
        console.error('Error submitting daily training:', error);
        showError('שגיאה בשליחת המשימה לשרת');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
}

function handleDailyTrainingKeyPress(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        const form = document.getElementById('dailyTrainingForm');
        if (form) {
            const formEvent = {
                preventDefault: () => {},
                target: form
            };
            submitDailyTraining(formEvent);
        }
    }
}
</script>
