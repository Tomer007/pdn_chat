<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data:; connect-src 'self';">
    <title>Neo - התחברות</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1c0f97;
            --secondary-color: #1c0f97;
            --accent-color: #1c0f97;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --gradient-start: #0b2e6b;
            --gradient-end: #0b2e6b;
        }

        /* Dark mode variables */
        [data-theme="dark"] {
            --primary-color: #3570d7;
            --secondary-color: #3570d7;
            --accent-color: #3570d7;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --bg-primary: #1f2937;
            --bg-secondary: #111827;
            --border-color: #374151;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --gradient-start: #0b2e6b;
            --gradient-end: #0b2e6b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0b2e6b 0%, #0b2e6b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            direction: rtl;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* Header with improved layout */
        .header-gradient {
            background: linear-gradient(135deg, #0b2e6b 0%, #0b2e6b 50%, #0b2e6b 100%);
            position: relative;
            overflow: hidden;
        }

        .header-gradient::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(224, 231, 255, 0.8));
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-link {
            cursor: pointer;
            transition: transform 0.2s ease;
            display: block;
        }

        .logo-link:hover {
            transform: scale(1.05);
        }

        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        .header-text {
            text-align: right;
        }

        /* Enhanced login container */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px var(--shadow-color);
            display: flex;
            flex-direction: column;
            animation: fadeIn 1s ease-in-out;
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 40px auto;
        }

        [data-theme="dark"] .login-container {
            background: rgba(31, 41, 55, 0.95);
            border: 1px solid rgba(55, 65, 81, 0.3);
        }

        /* Enhanced form styling */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(11, 46, 107, 0.2);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-primary);
            transition: all 0.3s ease;
            direction: rtl;
        }

        [data-theme="dark"] .form-input {
            background: rgba(31, 41, 55, 0.9);
            border: 2px solid rgba(11, 46, 107, 0.3);
            color: var(--text-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: #0b2e6b;
            box-shadow: 0 0 0 3px rgba(11, 46, 107, 0.1);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Enhanced submit button */
        .submit-button {
            width: 100%;
            background: #0b2e6b;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(11, 46, 107, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-button:hover {
            background: #0a2a5f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(11, 46, 107, 0.4);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading state */
        .loading {
            position: relative;
            color: transparent !important;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Error message styling */
        .error-message {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 8px 0;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        [data-theme="dark"] .error-message {
            background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 100%);
            color: #fca5a5;
            border: 1px solid #991b1b;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #0b2e6b;
            border: 1px solid rgba(11, 46, 107, 0.2);
            color: #ffffff;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        [data-theme="dark"] .theme-toggle {
            background: #0b2e6b;
            border: 1px solid rgba(11, 46, 107, 0.2);
        }

        .theme-toggle:hover {
            background: #0a2a5f;
            transform: scale(1.1);
        }

        /* Disclaimer styling */
        .disclaimer {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: right;
            direction: rtl;
        }

        .disclaimer h3 {
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .disclaimer p {
            font-size: 0.8em;
            line-height: 1.6;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .disclaimer p:last-child {
            font-weight: 500;
            color: #0b2e6b;
        }

        /* Footer links */
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(11, 46, 107, 0.2);
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .footer-link:hover {
            color: #0b2e6b;
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
                padding: 24px;
                border-radius: 16px;
            }

            .header-content {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-left {
                flex-direction: column;
                gap: 12px;
            }

            .header-text {
                text-align: center;
            }

            .theme-toggle {
                top: 10px;
                left: 10px;
                padding: 8px;
            }

            .footer-links {
                flex-direction: column;
                gap: 16px;
            }
        }

        /* Accessibility improvements */
        .form-input:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .login-container {
                border: 2px solid #000;
            }

            .form-input {
                border: 2px solid #000;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            .login-container, .submit-button {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>
<!-- Theme toggle -->
<button class="theme-toggle" onclick="toggleTheme()" title="החלף ערכת נושא" aria-label="החלף ערכת נושא">
    <i class="fas fa-moon"></i>
</button>

<!-- Header with improved layout -->
<header class="header-gradient" dir="ltr">
    <div class="header-content" dir="ltr">
        <!-- Logo and title section -->
        <div class="header-left">
            <a href="https://www.pdn.co.il" target="_blank" class="logo-link">
                <img src="/static/images/pdn_logo.png" alt="PDN Logo" class="header-logo"/>
            </a>
            <div class="header-text text-left">
                <h1 class="text-2xl font-bold mb-2 text-white" style="text-align: left;">Neo</h1>
                <p class="text-2xl opacity-90 text-white">PDN Center</p>
            </div>
        </div>
    </div>
</header>

<!-- Main container -->
<div class="container mx-auto p-6 max-w-4xl">
    <div class="login-container">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-blue-900 mb-2">Neo</h2>
            <p class="text-blue-700">התחבר כדי להתחיל   </p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-envelope"></i>
                    אימייל
                </label>
                <input type="email" id="username" name="email" required
                       class="form-input"
                       placeholder="הזן כתובת אימייל"
                       autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i>
                    סיסמה
                </label>
                <input type="password" id="password" name="password" required
                       class="form-input"
                       placeholder="הזן סיסמה"
                       autocomplete="current-password"
                       maxlength="50">
            </div>

            <button type="submit" class="submit-button">
                <i class="fas fa-sign-in-alt"></i>
               התחבר
            </button>
        </form>

        <div id="loginError" class="error-message">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span>אנא הזן אימייל וסיסמה תקינים</span>
        </div>
        <!-- Footer -->
        {% include 'partials/footer.html' %}
    </div>
</div>


<script>
    let isDarkMode = false;

    // Function to generate UUID
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0,
                v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // Function to show error message
    function showError(message) {
        const loginError = document.getElementById('loginError');
        const errorSpan = loginError.querySelector('span');
        errorSpan.textContent = message;
        loginError.style.display = 'block';
    }

    // Function to hide error message
    function hideError() {
        const loginError = document.getElementById('loginError');
        loginError.style.display = 'none';
    }

    // Function to validate form
    function validateForm() {
        const emailInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitButton = document.querySelector('.submit-button');
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        // Basic email validation (must contain @ and have at least 5 characters)
        const emailValid = email.length >= 5 && email.includes('@');
        const passwordValid = password.length >= 1;

        if (!emailValid || !passwordValid) {
            submitButton.disabled = true;
            return false;
        } else {
            submitButton.disabled = false;
            return true;
        }
    }

    // Theme toggle with proper state management
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');

        const themeIcon = document.querySelector('.theme-toggle i');
        themeIcon.className = isDarkMode ? 'fas fa-sun' : 'fas fa-moon';

        // Save preference
        localStorage.setItem('darkMode', isDarkMode);
    }

    // Hide error when user starts typing
    document.getElementById('username').addEventListener('input', function () {
        hideError();
        validateForm();
    });

    // Hide error when password is entered
    document.getElementById('password').addEventListener('input', function () {
        hideError();
        validateForm();
    });

    // Focus on username input when page loads
    document.addEventListener('DOMContentLoaded', function () {
        const usernameInput = document.getElementById('username');
        usernameInput.focus();

        // Load theme preference
        const savedTheme = localStorage.getItem('darkMode');
        if (savedTheme === 'true') {
            isDarkMode = true;
            document.documentElement.setAttribute('data-theme', 'dark');
            const themeIcon = document.querySelector('.theme-toggle i');
            themeIcon.className = 'fas fa-sun';
        }

        // Check if user is already logged in
        const storedUsername = localStorage.getItem('neo_username');
        const storedUserId = localStorage.getItem('neo_user_id');
        const storedPdnCode = localStorage.getItem('neo_pdn_code');

        if (storedUsername && storedUserId && storedPdnCode) {
            // User is already logged in, redirect to analysis page
            window.location.href = '/neo/analysis';
            return;
        }

        // Check if we have a stored username for auto-fill
        if (storedUsername) {
            usernameInput.value = storedUsername;
            validateForm();
        }
    });

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const emailInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitButton = document.querySelector('.submit-button');
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            showError('אנא הזן אימייל וסיסמה');
            return;
        }

        // Show loading state
        submitButton.classList.add('loading');
        submitButton.disabled = true;

        try {
            // Make API call to login endpoint
            const response = await fetch('/pdn-chat-ai/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {
                // Store user data in localStorage
                localStorage.setItem('neo_username', data.user_name);
                localStorage.setItem('neo_user_id', data.user_id);
                localStorage.setItem('neo_pdn_code', data.pdn_code);

                // Redirect to analysis page
                window.location.href = '/neo/analysis';
            } else {
                showError(data.error || 'שגיאה בהתחברות');
                submitButton.classList.remove('loading');
                submitButton.disabled = false;
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('שגיאה בחיבור לשרת');
            submitButton.classList.remove('loading');
            submitButton.disabled = false;
        }
    });

    // Handle Enter key press
    document.getElementById('username').addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !document.querySelector('.submit-button').disabled) {
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    });
</script>
</body>
</html>
